name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish src/Arrowless -c Release -o publish
      - name: Zip
        run: Compress-Archive -Path publish/Arrowless.exe -DestinationPath Arrowless-win-x64.zip
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Arrowless-win-x64.zip
          generate_release_notes: true
